    userErrors { field message }
  }
  fryingPans: collectionCreate(input: {title: "Frying Pans", handle: "frying-pans"}) {
    collection { id title handle }
    userErrors { field message }
  }
  tawas: collectionCreate(input: {title: "Tawas", handle: "tawas"}) {
    collection { id title handle }
