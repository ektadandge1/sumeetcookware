  }
  tadkaPans: collectionCreate(input: {title: "Tadka Pans", handle: "tadka-pans"}) {
    collection { id title handle }
    userErrors { field message }
  }
  braisingCasseroles: collectionCreate(input: {title: "Braising Casseroles", handle: "braising-casseroles"}) {
    collection { id title handle }
    userErrors { field message }
  }
  cutleryRacks: collectionCreate(input: {title: "Cutlery Racks", handle: "cutlery-racks"}) {
    collection { id title handle }
