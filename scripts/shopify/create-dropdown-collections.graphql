# Run once after checking that these handles do not already exist.
# Creates empty manual collections only; does not publish or change navigation.
mutation CreateDropdownCollections {
  drinkwareSets: collectionCreate(input: {title: "Drinkware Sets", handle: "drinkware-sets"}) {
    collection { id title handle }
    userErrors { field message }
  }
  casserole: collectionCreate(input: {title: "Casserole", handle: "casserole"}) {
    collection { id title handle }
    userErrors { field message }
  }
  ladlesSpoon: collectionCreate(input: {title: "Ladles & Spoon", handle: "ladles-spoon"}) {
